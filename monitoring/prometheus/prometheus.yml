global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"
  - job_name: "kafka-exporter"
    static_configs:
      - targets:
          - "kafka-exporter:8000"
  - job_name: "mongodb-exporter"
    static_configs:
      - targets:
          - "mongodb-exporter:9216"
    metrics_path: /metrics
  # JPO ODE Services metrics
  - job_name: "jpo-ode-svcs"
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - "ode:8080"
        labels:
          application: ode
  - job_name: "jpo-mec-deposit"
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - "mec-deposit:8080"
        labels:
          application: mec-deposit
  - job_name: "conflictmonitor"
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - "conflictmonitor:8082"
        labels:
          application: conflictmonitor
